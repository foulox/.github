name: PR story link

on:
  workflow_call:

permissions:
  pull-requests: write

jobs:
  link:
    runs-on: ubuntu-latest
    steps:
      - name: Inject Closes #N from story branch name
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          BRANCH: ${{ github.event.pull_request.head.ref }}
          PR_BODY: ${{ github.event.pull_request.body }}
        run: |
          if [[ ! "$BRANCH" =~ ^story/([0-9]+)- ]]; then
            echo "Branch '$BRANCH' is not a story branch — skipping"
            exit 0
          fi
          ISSUE="${BASH_REMATCH[1]}"
          if echo "$PR_BODY" | grep -iqE "(closes|fixes|resolves)[[:space:]]+#${ISSUE}([^0-9]|$)"; then
            echo "PR body already links issue #${ISSUE} ✓"
            exit 0
          fi
          NEW_BODY="${PR_BODY}

          Closes #${ISSUE}"
          gh api "repos/$REPO/pulls/$PR_NUMBER" -X PATCH -f "body=$NEW_BODY"
          echo "Injected 'Closes #${ISSUE}' into PR #${PR_NUMBER} ✓"
